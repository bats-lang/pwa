name: review-gate

# No pull request merges before an adversarial review (CLAUDE.md,
# "Adversarial review before merge"). The review is a comment on the pull
# request whose first line is "## Adversarial review". The newest such
# comment decides, alone: the commit status `adversarial-review` on the
# pull request's head commit is success only when that comment, outside
# fenced code blocks, has exactly one verdict line, `Verdict: approved`,
# and exactly one Reviewed line, `Reviewed: <the head's full SHA>`, and
# was never edited. Anything else is pending, never an older approval.
#
# pull_request_target runs this file as the base branch has it, so a pull
# request cannot rewrite its own gate. That is safe here: the job checks
# out nothing and runs no code of the pull request, and comment bodies are
# read by jq only, never put in a shell. It uses no action at all (only
# the runner's gh and jq), so there is no action to pin.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # An issue_comment event also fires for issues: only a pull request's counts
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Set the adversarial-review status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Neither event's GITHUB_SHA is the pull request's head (both are
          # the base branch's), so the status goes to the head commit read
          # from the pull request itself.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)

          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[]' > comments.jsonl

          jq -s --arg head "$head" '
            # The lines of a body, trailing blanks cut, outside fenced code
            # blocks (``` or ~~~; an unclosed fence hides the rest)
            def plain_lines:
              reduce ((. + "\n") | split("\n")[] | sub("[ \t\r]+$"; "")) as $line
                ({fence: null, out: []};
                 if .fence == null then
                   if ($line | test("^ {0,3}(```|~~~)"))
                   then .fence = ($line | sub("^ +"; "") | .[0:1])
                   else .out += [$line] end
                 elif (.fence as $fence
                       | $line | test("^ {0,3}" + (if $fence == "`" then "```+" else "~~~+" end) + "$"))
                 then .fence = null
                 else . end)
              | .out;
            # A line that, past markdown marks, starts with the word
            def field_lines($word):
              map(select(test("^[\\s*_>#`~|+\\-.0-9)]*" + $word + "\\b"; "i")));

            map(select(((.body // "") + "\n" | split("\n")[0] | sub("[ \t\r]+$"; ""))
                       == "## Adversarial review"))
            | sort_by(.created_at, .id)
            | last
            | if . == null then
                {state: "pending", url: "", text: "No adversarial review yet"}
              elif .updated_at != .created_at then
                {state: "pending", url: .html_url,
                 text: "The newest review was edited: a new verdict needs a new comment"}
              else
                (.body | plain_lines) as $lines
                | ($lines | field_lines("verdict")) as $verdicts
                | ($lines | field_lines("reviewed")) as $reviewed
                | if $verdicts == ["Verdict: changes needed"] then
                    {state: "pending", url: .html_url, text: "Adversarial review: changes needed"}
                  elif $verdicts != ["Verdict: approved"] then
                    {state: "pending", url: .html_url,
                     text: "The newest review has no single exact verdict line"}
                  elif $reviewed != ["Reviewed: " + $head] then
                    {state: "pending", url: .html_url,
                     text: "Approved, but not with one line Reviewed: <head SHA>; review the head"}
                  else
                    {state: "success", url: .html_url,
                     text: "Adversarial review: approved for this commit"}
                  end
              end
          ' comments.jsonl > verdict.json \
            || echo '{"state": "pending", "url": "", "text": "The gate could not read the reviews"}' > verdict.json
          cat verdict.json

          state=$(jq -r .state verdict.json)
          text=$(jq -r .text verdict.json)
          url=$(jq -r .url verdict.json)
          if [ -z "$url" ]; then
            url="${GITHUB_SERVER_URL}/${REPO}/pull/${PR}"
          fi

          gh api --method POST "repos/$REPO/statuses/$head" \
            -f state="$state" \
            -f context=adversarial-review \
            -f description="$text" \
            -f target_url="$url" > /dev/null
          echo "adversarial-review: $state on $head"
