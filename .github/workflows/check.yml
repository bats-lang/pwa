name: check

on:
  push:
    branches: [main]
  # A draft pull request runs no job (keyword: draft-ci, pwa#249), so marking it
  # ready must start the check: ready_for_review is added to the default types
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # The daily relock dispatches it on its relock/<date> branch: a pull
  # request opened with GITHUB_TOKEN starts no workflow by itself
  workflow_dispatch:
    inputs:
      emulator-options:
        description: Options added to the Android emulator's (android-smoke, pwa#207), say "-cores 1" for a throttled one
        required: false
        type: string
        default: ''

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the setup action names a pull request's head, the merge's second parent (bats#283)
          fetch-depth: 2

      # What every bats repository's job runs first (bats-lang/bats#287, #274), called by commit:
      # libgmp-dev and lld, the compiler built from bootstrap/c at .github/bats-version, the GMP
      # build of ATS2 (bats ats2 install: the pin and its SHA-256 are bats's), the package
      # repository at .github/repository-version (cloned to ~/repository), the commit the version
      # names, and the patsopt caps. bats.lock is required and read by the action.
      - name: Set up bats
        id: bats
        uses: bats-lang/bats/.github/actions/setup@8e978dfe7fac83726730361329c91b0e829beaad # bats 8e978df (#287)

      - name: Check library
        run: |
          # The committed lock (bats-lang/repository-prototype#269): never relocked here
          test -f bats.lock || { echo "::error::bats.lock is missing: run 'bats lock --repository <dir>' and commit it"; exit 1; }
          bats check --repository $HOME/repository

      # The unit tests of src/ (the Playwright version check, bats-lang/pwa#92)
      - name: Unit tests
        run: bats test --repository $HOME/repository

      - name: Dynamic tests
        run: tests/dynamic/run.sh $HOME/repository

      # The tool android.yml installs the smoke test's SDK packages with
      # (bats-lang/pwa#137), built as the android job builds it, against
      # small packages and a stand-in for Google's download server, and its
      # `repin` against fixtures of Google's repository XML (bats-lang/pwa#184)
      - name: SDK pins tool
        run: |
          (cd tools/android-sdk-pins && bats build --repository $HOME/repository)
          # the smoke test's retry (bats-lang/pwa#214): the tool's decision and android.yml's wiring,
          # against stand-in programs (tools/android-sdk-pins/src/smoke_tests.bats)
          (cd tools/android-sdk-pins && bats test --repository $HOME/repository)
          tests/android-sdk-pins/check.sh tools/android-sdk-pins/dist/debug/android-sdk-pins
          tests/android-sdk-pins/repin.sh tools/android-sdk-pins/dist/debug/android-sdk-pins

      # The tool the queue-passed action decides with (bats-lang/pwa#215) against
      # GitHub's own answers of the runs API: a passed queue run on the pushed
      # sha skips, every other case runs everything (area: queue-passed)
      - name: queue-passed tool
        run: |
          (cd tools/queue-passed && bats build --only debug --only native --repository $HOME/repository)
          tests/queue-passed/check.sh tools/queue-passed/dist/debug/queue-passed

      - name: Upload library to local repository
        run: bats upload --repository $HOME/repository

      - name: Lock deps
        run: |
          cd example
          bats lock --dev --repository $HOME/repository

      - name: Build example
        run: |
          cd example
          bats build --dev --repository $HOME/repository

      - name: Generate PWA
        run: |
          cd example
          bats run --bin build-pwa --dev --repository $HOME/repository

      - name: Verify PWA output
        run: |
          test -f example/dist/pwa/index.html
          test -f example/dist/pwa/bridge.js
          test ! -f example/dist/pwa/app.js
          test -f example/dist/pwa/app.wasm
          if grep -q "BATS PWA" example/dist/pwa/index.html; then exit 1; fi
          if grep -q "BATS PWA" example/dist/pwa/manifest.json; then exit 1; fi
          # installed, it opens and is shared its files
          grep -q '"file_handlers"' example/dist/pwa/manifest.json
          grep -q '"share_target"' example/dist/pwa/manifest.json
          grep -q 'share-target' example/dist/pwa/service-worker.js
          echo "PWA files verified, no app.js, no BATS PWA in static files"

      - name: Verify Android project
        run: |
          test -f example/dist/android/capacitor.config.json
          test -f example/dist/android/package.json
          test -f example/dist/android/android-release.gradle
          test -x example/dist/android/build-android.sh
          grep -q '"webDir": "../pwa"' example/dist/android/capacitor.config.json
          # valid JSON, with fetch to other origins through native HTTP
          python3 -c "import json,sys; c=json.load(open(sys.argv[1])); assert c['plugins']['CapacitorHttp']['enabled'] is True" example/dist/android/capacitor.config.json
          # No keystore or secret is ever written: signing reads them at build time
          test ! -e example/dist/android/release.jks
          test ! -e example/dist/pwa/release.jks
          if grep -rq "storePassword '" example/dist/android example/dist/pwa; then exit 1; fi
          test -x example/dist/android/smoke-test.sh
          # the app's activity (package from the app id) and the types it opens
          grep -q '^package dev.bats.example;' example/dist/android/MainActivity.java
          grep -q 'android:mimeType="text/plain"' example/dist/android/intent-filters.xml
          # opened at its own scheme's addresses, which are not files
          python3 -c "import sys, xml.dom.minidom as m; m.parseString('<activity xmlns:android=\"http://schemas.android.com/apk/res/android\">' + open(sys.argv[1]).read() + '</activity>')" example/dist/android/intent-filters.xml
          grep -q '"content".equals(data.getScheme())' example/dist/android/MainActivity.java
          # Auto Backup keeps bridge's backed-up files and nothing else
          for f in backup-rules data-extraction-rules; do
            python3 -c "import sys, xml.dom.minidom as m; d = m.parse(sys.argv[1]); i = d.getElementsByTagName('include'); assert i and all(e.getAttribute('domain') == 'file' and e.getAttribute('path') == 'backup/' for e in i); assert not d.getElementsByTagName('exclude')" "example/dist/android/$f.xml"
          done
          grep -q 'android:fullBackupContent=' example/dist/android/build-android.sh
          # the activity calls batsNative only once it exists (quire#220)
          grep -q '(globalThis.batsNative ? globalThis.batsNative.deliverFile(' example/dist/android/MainActivity.java
          grep -q '(globalThis.batsNative ? globalThis.batsNative.key(' example/dist/android/MainActivity.java
          # the Kotlin standard library forced is the one bridge's plugins need
          kotlin=$(sed -n 's/^implement plugins_kotlin () = "\(.*\)"$/\1/p' example/bats_modules/wasm.bats-packages.dev/bridge/src/plugins.bats)
          test -n "$kotlin"
          test "$(grep -c "org.jetbrains.kotlin:kotlin-stdlib[-a-z0-9]*:$kotlin'" example/dist/android/android-release.gradle)" = 3
          # its activity hands each intent's files to the page once (quire#247)
          sh tests/android/activity.sh example/dist/android/MainActivity.java
          # the plugins it installs are exactly those of bridge's table
          python3 tests/android/plugins.py example/dist/android/package.json \
            example/bats_modules/wasm.bats-packages.dev/bridge/src/plugins.bats

      # The example's committed lock, beside the generated project, as an
      # app's build puts its own there: build-android.sh installs from it
      # with --frozen-lockfile and refuses to run without one (bats-lang/pwa#131).
      # The android job below installs exactly it, so a lock that does not
      # match the generated package.json fails there.
      - name: Put the example's lock beside the Android project
        run: cp example/pnpm-lock.yaml example/dist/android/pnpm-lock.yaml

      # the generated install fails on a missing lock and on one that does
      # not match package.json (a stand-in corepack, then the real pnpm)
      - name: Android install from a lock
        timeout-minutes: 15
        run: tests/android-lock/check.sh example/dist/android/build-android.sh

      # A file for the Android smoke test to open the app with
      - name: Make the file to open
        run: echo "A file the example app is opened with" > example/dist/android/smoke-share.txt

      - name: Upload Android project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-android
          # the project's .nvmrc and .java-version are dotfiles; upload-artifact skips them by default (keyword: version-file)
          include-hidden-files: true
          path: |
            example/dist/android
            example/dist/pwa
          retention-days: 1

      # Node's packages (exactly example/package-lock.json, retried on a
      # dropped connection) and Chromium, by the action apps call by commit
      # (bats-lang/quire#637); the example is its first user
      - name: Set up the e2e tests
        uses: ./.github/actions/e2e-setup
        with:
          working-directory: example
          japanese-font: "true"
          stall-tools: "true"

      # the deprecated node-version input still works beside node-version-file
      # (bats-lang/pwa#254, removal bats-lang/pwa#261): the file named does not exist
      - name: Set up the e2e tests with the deprecated node-version
        id: old-node-version
        uses: ./.github/actions/e2e-setup
        with:
          working-directory: example
          node-version: "22.23.3"
          node-version-file: no-such-file

      - name: The deprecated node-version was used
        run: test "$(node --version)" = "v22.23.3"

      # the action's scripts, against a fake npm and a registry that resets
      # connections (the action's YAML runs in the step above)
      - name: e2e-setup action
        run: tests/e2e-setup/check.sh

      # fetch-pnpm.sh, which build-android.sh sources (bats-lang/pwa#158): the
      # real corepack against a mirror whose first answer comes after the
      # downloader's 30 s timeout, and one that never answers. Shell, since
      # it tests a generated shell script that runs in an app's checkout
      # with no bats (tests/android/activity.sh is the precedent)
      - name: pnpm fetch script
        run: sh tests/android/pnpm.sh example/dist/android/fetch-pnpm.sh

      # android-smoke: smoke-test.sh keeps the page's DOM when its text never shows (pwa#166)
      # and plays the system font scale (pwa#154)
      - name: Smoke test keeps the page's DOM and plays the font scale
        run: tests/android-smoke-dom/check.sh example/dist/android/smoke-test.sh

      # scripts/play-release.sh (bats-lang/pwa#90) against a stub of Play's
      # edits API, and the pins of play-release.yml's actions; the workflow
      # itself needs Google and runs in an app's release job
      - name: Play release script
        run: tests/play-release/run.sh

      # scripts/key-fingerprints.sh (bats-lang/pwa#96) on keystores made
      # with keytool; android.yml's steps that call it run in an app's job
      - name: Key fingerprints script
        run: tests/key-fingerprints/run.sh

      # gen-pwa test (bats-lang/pwa#82) with a stand-in Playwright: the
      # port handed over and freed, two runs taking turns, nothing left
      # after a kill or a failure, the serial run on one worker
      - name: gen-pwa test
        run: tests/test-command/check.sh example/dist/debug/build-pwa example/dist/pwa

      # gen-pwa pages (bats-lang/pwa#243): the tree copied byte for byte, and each refusal, a bats test of the built binary
      - name: gen-pwa pages
        run: (cd tests/static-pages && bats test --repository $HOME/repository)

      # gen-pwa values (bats-lang/pwa#244): quire's sync-clients.json byte for byte, and each refusal
      - name: gen-pwa values
        run: tests/values/check.sh example/dist/debug/build-pwa

      # the example's suite, run as an app runs it: build-pwa test serves
      # dist/pwa itself and checks the browsers Playwright expects
      - name: Run e2e tests
        run: |
          cd example
          ./dist/debug/build-pwa test --timings ../e2e-timings

  # The example's Android app, built by the reusable workflow; unsigned,
  # since this repository has no keystore
  android:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: check
    uses: ./.github/workflows/android.yml
    with:
      artifact: example-android
      project-dir: android
      # Rendered by the example's wasm (not in its static files)
      smoke-test-text: BATS PWA
      # then opened with a text file and shared it: each handed to the
      # page once (the example shows its text whatever it is given)
      smoke-share-file: android/smoke-share.txt
      smoke-share-type: text/plain
      smoke-share-text: BATS PWA
      emulator-extra-options: ${{ inputs.emulator-options || '' }}

  # The queue-passed action itself (bats-lang/pwa#215), called as an app calls
  # it, from a fixture of the API's answer in place of the API: a push of a sha
  # the queue passed skips and names the queue run, and any other event never does
  queue-passed-action:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: A push of a commit the queue passed
        id: passed
        uses: ./.github/actions/queue-passed
        with:
          event: push
          sha: 7fb2de0db6a22d79b672b2c75eb246400e5630d4
          workflow-ref: bats-lang/quire/.github/workflows/check.yml@refs/heads/main
          runs-file: tests/queue-passed/answers/passed.json

      - name: It skips and names the queue run
        env:
          SKIP: ${{ steps.passed.outputs.skip }}
          RUN_URL: ${{ steps.passed.outputs.run-url }}
        run: test "$SKIP" = true && test "$RUN_URL" = https://github.com/bats-lang/quire/actions/runs/40229598535

      - name: The same answer asked by a nightly run
        id: nightly
        uses: ./.github/actions/queue-passed
        with:
          event: schedule
          sha: 7fb2de0db6a22d79b672b2c75eb246400e5630d4
          workflow-ref: bats-lang/quire/.github/workflows/check.yml@refs/heads/main
          runs-file: tests/queue-passed/answers/passed.json

      - name: It never skips
        env:
          SKIP: ${{ steps.nightly.outputs.skip }}
        run: test "$SKIP" = false
