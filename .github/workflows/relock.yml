# Daily: relock this package and move its CI pins to their newest, as a
# pull request that runs check.yml (bats-lang/repository-prototype#269).
# The work is the shared relock-pins.yml, called by commit.
name: relock

on:
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@27c4400526b73660e3c23d960748599658bce275 # repository-prototype main 27c4400
    secrets: inherit
    with:
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/publish.yml
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
      repin-command: |
        sh tools/android-sdk-pins/relock.sh tools/android-sdk-pins
      repin-paths: |
        tools/android-sdk-pins
