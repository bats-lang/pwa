# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@61051537b0eda7d57c5370aac1f9047d63c03dd9 # repository-prototype main 6105153
    secrets: inherit
