# Keeps the pins of CI moving through reviewed pull requests (bats-lang/
# pwa#141, decided on bats-lang/repository-prototype#367, as dom#93 and
# capacitor-plugins#15 have it). github-actions updates each action pinned by
# commit with its "# vX.Y.Z" comment. npm updates example/package.json and
# example/package-lock.json (the Playwright and serve versions the e2e tests
# run on).
#
# Not here: Node's and Java's versions, which are the version files `.nvmrc` and
# `.java-version` (bats-lang/pwa#136), not a literal in a workflow. Dependabot
# names none of them, so they are moved by hand until pwa#144's relock subcommand.
# The bats setup action's commit (ignored below) and the runner label are moved
# by hand.
#
# One pull request for all of them (bats-lang/pwa#156, as quire#799): the group
# below spans both ecosystems, so a weekly run opens one pull request and one
# `check` run, not one for each update.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    patterns: ["*"]
updates:
  - package-ecosystem: github-actions
    # The docs (dependabot-options-reference) read /.github/workflows and the
    # root action.yml only and name no composite actions under .github/actions.
    # dependabot-core's github_actions file fetcher reads action.yml in each
    # directory it is given, so each of those directories is listed by its glob;
    # no Dependabot run has shown the glob yet (bats-lang/pwa#143).
    directories:
      - /
      - /.github/actions/*
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # a release is a week old before it is proposed, so a compromised one
    # can be noticed first
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: bats-lang/*
  - package-ecosystem: npm
    directory: /example
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
